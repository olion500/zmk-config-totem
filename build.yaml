# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Prospector dongle (XIAO nRF52840 + Waveshare 1.69" LCD).
  # Board target = xiao_ble: ZMK adds a 'zmk' variant on the
  # standard Zephyr xiao_ble board (see zmk/app/boards/seeed/xiao_ble/board.yml).
  # The module README writes this as `xiao_ble//zmk` but Zephyr 4.1 wants the
  # full <board>/<soc>/<variant> form locally.
  # ZMK Studio reaches the central via the dongle's USB-C from here on.
  - board: xiao_ble/nrf52840/zmk
    shield: totem_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: totem_dongle

  # settings_reset firmware — flash this to ALL THREE boards before first pair.
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset

  # Left half — now a peripheral. cmake-args overrides the central=y default
  # from boards/shields/totem/Kconfig.defconfig for this build only.
  # Board target must use the //zmk variant (xiao_ble/nrf52840/zmk): the plain
  # `xiao_ble` board does NOT activate CONFIG_ZMK_BLE, so the peripheral half
  # would build without a BLE stack and never advertise to the dongle.
  - board: xiao_ble/nrf52840/zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: xiao_ble/nrf52840/zmk
    shield: totem_right
